document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.calc'))e.preventDefault()});
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('.calc'))e.preventDefault()},{passive:false});
$('run').onclick=runProgram;$('stop').onclick=stopRun;$('check').onclick=showCheck;$('keytest').onclick=startKeyTest;
$('open').onchange=async e=>{let f=e.target.files[0];if(!f)return;code.value=await f.text();updateMeta();showCheck();e.target.value=''};
$('save').onclick=()=>{let text=code.value.replace(/\r?\n/g,'\r\n'),b=new Blob([text],{type:'text/x-python'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='module.py';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('addModule').onchange=async e=>{for(const f of e.target.files){if(!/\.py$/i.test(f.name))continue;let s=await f.text();userModules[f.name]=s}try{localStorage.setItem('cg100modules',JSON.stringify(userModules))}catch(e){};renderModules();injectUserModules();showCheck();e.target.value=''};
$('addFolder').onchange=async e=>{
 const files=[...e.target.files].filter(f=>/\.py$/i.test(f.name));
 if(!files.length){e.target.value='';return}
 userModules={};
 for(const f of files){
  let rel=(f.webkitRelativePath||f.name).replace(/\\/g,'/');
  let parts=rel.split('/');
  if(parts.length>1)parts.shift();
  rel=parts.join('/')||f.name;
  const text=await f.text();
  if(rel.toLowerCase()==='module.py'){code.value=text;editorTop=0;updateMeta()}
  else userModules[rel]=text;
 }
 try{localStorage.setItem('cg100modules',JSON.stringify(userModules))}catch(e){};
 renderModules();injectUserModules();showCheck();renderEditor();
 setStatus(`Loaded project: ${files.length} Python file${files.length===1?'':'s'}`,'good');
 e.target.value='';
};
code.addEventListener('input',()=>{updateMeta();if(lcdMode==='editor')renderEditor()});code.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();let a=code.selectionStart,b=code.selectionEnd;code.setRangeText('  ',a,b,'end')}});
setInterval(()=>{let now=performance.now();if(now-lastFps>=1000){$('fps').textContent=Math.round((frames-lastFrames)*1000/(now-lastFps))+' fps';lastFrames=frames;lastFps=now}},500);
const codePanel=$('codePanel'),codeToggle=$('codeToggle'),codeClose=$('codeClose');
function setCodePanel(open){codePanel.classList.toggle('open',!!open);codeToggle.textContent=open?'CLOSE':'CODE'}
codeToggle.onclick=()=>setCodePanel(!codePanel.classList.contains('open'));
codeClose.onclick=()=>setCodePanel(false);
try{const saved=localStorage.getItem('cg100code');if(saved)code.value=saved}catch(e){}
renderModules();updateMeta();
 document.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault()});
 document.addEventListener('drop',async e=>{if(!e.dataTransfer.files.length)return;e.preventDefault();const fs=[...e.dataTransfer.files].filter(f=>/\.py$/i.test(f.name));for(const f of fs){const text=await f.text();if(f.name.toLowerCase()==='module.py'){code.value=text;updateMeta()}else userModules[f.name]=text}try{localStorage.setItem('cg100modules',JSON.stringify(userModules))}catch(e){};renderModules();injectUserModules();renderEditor()});
function loadRuntimeScript(url,timeout=9000){return new Promise((resolve,reject)=>{let done=false,s=document.createElement('script'),timer=setTimeout(()=>{if(done)return;done=true;s.remove();reject(new Error('Timed out loading '+url))},timeout);s.src=url;s.async=true;s.onload=()=>{if(done)return;done=true;clearTimeout(timer);resolve()};s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);s.remove();reject(new Error('Could not load '+url))};document.head.appendChild(s)})}
async function ensureSkulpt(){
 if(window.Sk&&Sk.builtinFiles)return true;
 setStatus('Loading Python runtime…','');
 // Script tags are substantially more reliable than cross-origin fetch from an iPhone/local HTML file.
 const bases=['https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/','https://unpkg.com/skulpt@1.2.0/dist/','https://raw.githubusercontent.com/skulpt/skulpt-dist/refs/heads/master/'];
 for(const base of bases){
  try{
   if(!window.Sk)await loadRuntimeScript(base+'skulpt.min.js');
   if(window.Sk&&!Sk.builtinFiles)await loadRuntimeScript(base+'skulpt-stdlib.js');
   if(window.Sk&&Sk.builtinFiles)return true
  }catch(e){}
 }
 return false
}
let runtimePromise=null;async function prepareRuntime(){if(skReady)return true;if(runtimePromise)return runtimePromise;runtimePromise=(async()=>{try{if(await ensureSkulpt()){installBridge();skReady=true;setStatus('Ready','good');return true}return false}catch(e){consoleEl.textContent=String(e);setStatus('Runtime error','bad');return false}finally{runtimePromise=null}})();return runtimePromise}
setStatus('Loading Python…','');consoleEl.textContent='Preparing the Python runtime…\n';renderEditor();prepareRuntime().then(ok=>{if(!ok){setStatus('Python unavailable','bad');consoleEl.textContent+='Could not load Python. Connect to the internet once, then reopen this file.\n'}})
});</script></body></html>
